version: 2

multi-ecosystem-groups:
  application:
    schedule:
      interval: "weekly"
  documentation:
    schedule:
      interval: "monthly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "application"

  - package-ecosystem: "pip"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "application"

  - package-ecosystem: "npm"
    directory: "/web"
    patterns: ["*"]
    multi-ecosystem-group: "application"
    # typescript@7 ships only the native tsc binary, not the JS compiler API.
    # typescript-eslint and svelte-check both need the TS 6 API, so `typescript`
    # stays on 6.x and TS 7 is installed alongside it as the @typescript/native
    # alias. Revisit when typescript-eslint gains TS 7 support:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/docs_html"
    patterns: ["*"]
    multi-ecosystem-group: "documentation"

  - package-ecosystem: "npm"
    directory: "/public_html"
    patterns: ["*"]
    multi-ecosystem-group: "documentation"
