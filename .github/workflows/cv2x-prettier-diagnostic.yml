# Temporary, read-only Prettier diagnostic for PR #878.
# Remove this workflow immediately after applying its exact formatter output.
name: C-V2X Prettier diagnostic
on:
  push:
    branches:
      - docs/cv2x-receiver-feasibility-research
    paths:
      - .github/workflows/cv2x-prettier-diagnostic.yml
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: Install pinned formatter dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Format plan and report exact resulting bytes
        run: |
          pnpm --dir web exec prettier --ignore-path ../.prettierignore --write ../docs/plans/platform-cv2x-roadside-receiver-feasibility-plan.md
          node -e 'const fs=require("fs"); process.stdout.write("PRETTIER_RESULT_START"+JSON.stringify(fs.readFileSync("docs/plans/platform-cv2x-roadside-receiver-feasibility-plan.md","utf8"))+"PRETTIER_RESULT_END\n")'
