name: 🧭 Go CI

on:
  # Run on PRs when Go files change
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/go-ci.yml"
      - "scripts/go-test-shard.sh"
      - "go.mod"
      - "go.sum"
  # Run on push to main to update coverage badges
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/go-ci.yml"
      - "scripts/go-test-shard.sh"
      - "go.mod"
      - "go.sum"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false # lint only runs gofmt — no modules needed

      - name: Run make lint-go
        run: make lint-go

  build:
    # Runs beside the tests rather than gating them: a compile error fails the
    # test shards too, and waiting for this job cost every run 1.5 minutes.
    name: "🔨 Build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies (libpcap)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: Build binary
        # Compile check only; skip embedding the ~30 MB typst binary here (the
        # release / image workflows build and verify the embedded form).
        run: make build-velocity TYPST_EMBED=0

  test:
    # scripts/go-test-shard.sh owns which packages and tests each shard runs,
    # and with which flags; `make test-go-shard SHARD=<shard>` reproduces one
    # locally. The shards partition the module, so a new package is tested
    # without editing a list.
    name: "🧪 Test ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Report every shard's failures, not just the first one's.
      fail-fast: false
      matrix:
        include:
          - shard: core
          - shard: replay-a
            lfs: true
          - shard: replay-b
            lfs: true
          - shard: lidar-a
            lfs: true
          - shard: lidar-b
            lfs: true
          - shard: lidar-rest
            lfs: true
          - shard: api
            web: true
          - shard: other
            lfs: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Six shards read the kirk0 fixtures. Restoring the LFS objects from the
      # Actions cache keeps that from becoming six LFS downloads per run.
      - name: List LFS objects
        if: matrix.lfs
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS objects
        if: matrix.lfs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Check out LFS files
        if: matrix.lfs
        run: git lfs pull

      - name: Validate LFS files
        if: matrix.lfs
        run: ./scripts/validate-lfs-files.sh

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies (libpcap)
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: Setup pnpm and build web
        if: matrix.web
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          cd web
          pnpm install
          pnpm run build

      - name: Record runner CPU
        # Hosted runners differ in CPU generation, and the same tests take up
        # to 1.6x longer on the slowest. Logged so a slow run can be told
        # apart from a slow change.
        run: lscpu | grep -m1 'Model name' || true

      - name: Run ${{ matrix.shard }} tests
        # Fills in the web and offline-docs embed stubs where no build exists.
        run: make test-go-shard SHARD=${{ matrix.shard }}

      - name: Upload ${{ matrix.shard }} coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out

  coverage:
    name: "📈 Coverage"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Merge coverage profiles
        # replay-a and replay-b both profile replayeval; Codecov merges the
        # repeated blocks line by line.
        run: |
          echo "mode: atomic" > coverage.out
          for f in coverage-artifacts/*.out; do
            echo "Merging $f"
            tail -n +2 "$f" >> coverage.out
          done
          echo "Combined coverage has $(wc -l < coverage.out) lines"

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v5.3.2
        with:
          files: ./coverage.out
          flags: go
          name: go-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
