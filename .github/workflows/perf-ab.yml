name: ⚡ Perf A/B

# Benchmarks the pull request's base and head on the same runner, alternately,
# and fails when the change makes the pipeline slower than the threshold.
#
# The nightly gate compares against a committed baseline, and a change that
# moves the tuning fingerprint recaptures that baseline in the same pull
# request — so its own cost is never measured. This compares code with code.
# See docs/lidar/operations/performance-regression-testing.md.

on:
  pull_request:
    paths:
      - ".github/workflows/perf-ab.yml"
      - "cmd/tools/lidar-bench/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "internal/config/**"
      - "internal/lidar/**"
      - "scripts/perf-ab.sh"
      - "scripts/perf_ab_compare.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ab:
    name: "⚡ Perf A/B (base vs head)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          # The base commit is built from its own tree.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Benchmark base and head
        env:
          CI: "true"
          OUT: ${{ runner.temp }}/perf-ab
          ROUNDS: "5"
          THRESHOLD: "0.10"
        run: |
          set +e
          ./scripts/perf-ab.sh "${{ github.event.pull_request.base.sha }}"
          status=$?
          [ -f "$OUT/summary.md" ] && cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-ab-runs
          path: ${{ runner.temp }}/perf-ab/runs
          if-no-files-found: ignore
