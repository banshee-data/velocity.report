name: 📏 Capture Perf Baseline

# Regenerates the LiDAR perf-regression baselines on the hardware the nightly
# gate actually runs on. A baseline captured anywhere else measures that other
# machine: local runs on an M1 are roughly 1.4x faster than this runner.
#
# The result is uploaded as an artifact rather than committed. Committing a
# baseline is a deliberate act — it redefines what "no regression" means — so
# it goes through a pull request like any other change to the gate.
#
# It also runs on pull requests that touch the perf harness or the committed
# baselines. That is the only way to capture on runner hardware before a merge:
# GitHub registers workflow_dispatch from the default branch only, so a change
# that needs a fresh baseline cannot dispatch one until after it has landed —
# and it needs the baseline to land. Path-filtered, so ordinary pull requests
# never pay for it.

on:
  pull_request:
    paths:
      - ".github/workflows/perf-baseline.yml"
      - "Makefile"
      - "internal/cmd/lidar/**"
      - "internal/config/**"
      - "internal/lidar/lidarbench/**"
      - "internal/lidar/perf/baseline/**"
  workflow_dispatch:
    inputs:
      profile:
        description: "Pipeline profile to capture (or 'gated' for full + l3-only)"
        required: true
        default: "gated"
        type: choice
        options:
          - gated
          - full
          - l3-only
          - detect
      capture:
        description: "Capture name under internal/lidar/perf/pcap"
        required: true
        default: "kirk0"
        type: string
      repeats:
        description: "Runs per profile; the median by wall clock is kept"
        required: true
        default: "5"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: "📏 Capture (${{ inputs.profile || 'gated' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build web stub for embed
        run: ./scripts/ensure-web-stub.sh

      - name: Build offline docs stub for embed
        run: ./scripts/ensure-docs-stub.sh

      - name: Capture baseline
        env:
          CI: "true"
          NAME: ${{ inputs.capture || 'kirk0' }}
          PERF_BASELINE_REPEATS: ${{ inputs.repeats || '5' }}
          PROFILE: ${{ inputs.profile || 'gated' }}
        run: |
          if [ "$PROFILE" = "gated" ]; then
            make perf-baseline-all
          else
            make perf-baseline PROFILE="$PROFILE"
          fi

      - name: Show captured baselines
        run: |
          for f in internal/lidar/perf/baseline/baseline-*-ci.json; do
            echo "===== $f ====="
            cat "$f"
          done

      - name: Upload captured baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-baselines-${{ inputs.profile || 'gated' }}
          path: internal/lidar/perf/baseline/baseline-*-ci.json
          if-no-files-found: error
