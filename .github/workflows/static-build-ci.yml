# static-build-ci — verify the fully-static linux/{amd64,arm64} build
# produces working binaries on every PR and main push.
#
# What this catches:
#   - Dockerfile.static-build regressions (toolchain pins, layer order)
#   - libpcap submodule drift
#   - --self-check failures in a clean Debian target (DNS, UDP, libpcap)
#
# Docs-only PRs do not run this job: docs content (docs/, data/, *.md,
# docs_html/) is not among the pull_request paths below. Their embed is
# checked by docs-offline-ci instead: `make test-docs-offline-routes`
# serves every generated page through the embedded /docs/ handler, and
# `make check-docs-embed-context` runs this Dockerfile's manifest check
# (embed-check stage) without compiling. Every push to main still runs
# this job unfiltered, so each merge proves the full embed in the release
# binary.
#
# Runs take ~6 minutes with a warm Go build cache: ~1.3 min for the
# Docker build (~40 s of Go compile for both arches), ~2.5 min for the
# ARM64 VM boot under TCG, and the rest in docs, smoke tests and setup.
# The toolchain/libpcap layers, the Go build cache and the VM gate's
# .debs are cached between runs. A cold Go cache (~3 min of compile, until
# a main push saves one) adds ~2.5 min; a layer or .deb miss adds
# ~1.5 min, or more if the Ubuntu mirror is slow.

name: Static build CI

on:
  pull_request:
    paths:
      - "cmd/velocity/**"
      - "internal/cmd/server/**"
      - "internal/**"
      - "image/Dockerfile.static-build*"
      - "assets.go"
      - "config/tuning.defaults.json"
      - "config/segment-selectors.defaults.json"
      - "Makefile"
      - "scripts/build-radar-static.sh"
      - "scripts/ensure-web-stub.sh"
      - "scripts/ensure-docs-stub.sh"
      - "scripts/write-embedded-docs-manifest.py"
      - "scripts/verify-embedded-docs-server.py"
      - "scripts/*static*.sh"
      - "third_party/libpcap-static/**"
      - ".gitmodules"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/static-build-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM64_VM_PACKAGES: qemu-system-arm qemu-efi-aarch64 qemu-utils ipxe-qemu genisoimage

jobs:
  build-and-smoke-test:
    name: Static build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          lfs: true

      # qemu/binfmt registration so we can run arm64 binaries in the
      # smoke-test step on this amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Node.js and pnpm for embedded docs
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "22"
          working-directory: docs_html

      - name: Build complete embedded docs site
        run: make build-docs-offline

      # Persist the toolchain and libpcap stages between runs. Each job
      # gets a fresh buildx builder, so without this every run rebuilds
      # them (~80 s). Layer caching does not carry BuildKit cache mounts,
      # so the Go build cache is saved separately below.
      - name: Key the BuildKit layer cache
        id: layer-cache-key
        run: echo "libpcap=$(git rev-parse HEAD:third_party/libpcap)" >> "$GITHUB_OUTPUT"

      - name: Restore BuildKit layer cache
        id: layer-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/buildkit-cache
          key: static-build-layers-${{ runner.arch }}-${{ steps.layer-cache-key.outputs.libpcap }}-${{ hashFiles('image/Dockerfile.static-build', 'go.mod', 'go.sum', 'third_party/libpcap-static/**') }}
          restore-keys: static-build-layers-${{ runner.arch }}-

      # Persist the Go build cache too. It seeds the build's cache mount,
      # so only changed packages compile (cold is ~70 s per arch). The
      # prefix pins the runner arch, the Go toolchain (go.mod's directive
      # and the Dockerfile's tarball pins) and the modules; on a miss any
      # older entry for the arch is still mostly warm, and Go's cache is
      # content-addressed, so a stale entry is never reused wrongly. The
      # date suffix limits saves to one a day per prefix, and only main
      # pushes and manual runs save: PRs read main's cache without adding
      # entries to the repository's cache quota.
      - name: Key the Go build cache
        id: go-cache-key
        env:
          PREFIX: static-build-gocache-${{ runner.arch }}-
          INPUTS: ${{ hashFiles('image/Dockerfile.static-build', 'go.mod', 'go.sum') }}
        run: |
          echo "arch-prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX$INPUTS-" >> "$GITHUB_OUTPUT"
          echo "key=$PREFIX$INPUTS-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Go build cache
        id: go-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: ${{ steps.go-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.go-cache-key.outputs.prefix }}
            ${{ steps.go-cache-key.outputs.arch-prefix }}

      - name: Build static binaries (amd64 + arm64)
        env:
          LAYER_CACHE: ${{ runner.temp }}/buildkit-cache
          LAYER_CACHE_HIT: ${{ steps.layer-cache.outputs.cache-hit }}
          GO_CACHE: ${{ runner.temp }}/go-build-cache
          GO_CACHE_SAVE: ${{ steps.go-cache.outputs.cache-hit != 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        run: |
          if [[ -f "$LAYER_CACHE/index.json" ]]; then
            export BUILD_CACHE_FROM="type=local,src=$LAYER_CACHE"
          fi
          # Export only when the key missed, into a fresh directory: the
          # local exporter never prunes, so writing over the restored
          # cache would carry stale blobs forward.
          if [[ "$LAYER_CACHE_HIT" != "true" ]]; then
            export BUILD_CACHE_TO="type=local,dest=$LAYER_CACHE.new,mode=max"
          fi
          export GO_BUILD_CACHE_FROM="$GO_CACHE"
          # Export beside the restored cache, not over it: the restored
          # one stays the seed for the reproducibility rebuild below.
          if [[ "$GO_CACHE_SAVE" == "true" ]]; then
            export GO_BUILD_CACHE_TO="$GO_CACHE.new"
          fi
          make build-radar-static
          if [[ -d "$LAYER_CACHE.new" ]]; then
            rm -rf "$LAYER_CACHE"
            mv "$LAYER_CACHE.new" "$LAYER_CACHE"
          fi

      - name: Verify embedded docs routes in the amd64 binary
        run: |
          bin=$(ls build/static/velocity-report-*-linux-amd64-*-static | head -1)
          python3 scripts/verify-embedded-docs-server.py "$bin"

      - name: Verify static ELF and embedded release features
        run: |
          for bin in build/static/velocity-report-*-static; do
            ./scripts/verify-static-elf.sh "$bin"
          done

      - name: Smoke-test amd64 binary
        run: |
          bin=$(ls build/static/velocity-report-*-linux-amd64-*-static | head -1)
          ./scripts/smoke-test-static.sh "$bin"

      - name: Validate canonical LiDAR capture with release binary
        run: |
          bin=$(ls build/static/velocity-report-*-linux-amd64-*-static | head -1)
          ./scripts/test-static-golden-pcap.sh "$bin"

      - name: Smoke-test arm64 binary (under qemu)
        run: |
          bin=$(ls build/static/velocity-report-*-linux-arm64-*-static | head -1)
          ./scripts/smoke-test-static.sh "$bin"

      # The runner's Ubuntu mirror is sometimes throttled to tens of kB/s,
      # which once stretched this install from 20 s to 23 min. Keep the
      # downloaded .debs between runs so only the package index comes from
      # the mirror, and install only what the VM gate uses. qemu-img (in
      # qemu-utils) and virtio-net-pci's option ROM (in ipxe-qemu) are
      # named so they do not depend on recommends.
      - name: Key the ARM64 test package cache
        id: apt-cache-key
        env:
          PACKAGES: ${{ env.ARM64_VM_PACKAGES }}
        run: echo "key=arm64-vm-debs-$ImageOS-$ImageVersion-$(echo "$PACKAGES" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore ARM64 test package cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: arm64-vm-debs-

      - name: Install full-system ARM64 test dependencies
        env:
          APT_ARCHIVES: ${{ runner.temp }}/apt-archives
        run: |
          mkdir -p "$APT_ARCHIVES/partial"
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$APT_ARCHIVES")
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends $ARM64_VM_PACKAGES
          # Drop superseded versions carried in by a restore-keys match.
          sudo apt-get "${apt_opts[@]}" autoclean
          sudo rm -f "$APT_ARCHIVES/lock"
          sudo chown -R "$(id -u):$(id -g)" "$APT_ARCHIVES"

      - name: Test ARM64 binary under an ARM64 kernel
        run: |
          bin=$(ls build/static/velocity-report-*-linux-arm64-*-static | head -1)
          ./scripts/test-static-arm64-vm.sh "$bin"

      # Pass the same Go cache seed as the first build. The seed is an
      # input to the compile step, so a different one would recompile
      # rather than replay the layer.
      - name: Verify reproducible static artifacts
        env:
          GO_BUILD_CACHE_FROM: ${{ runner.temp }}/go-build-cache
        run: |
          sha256sum build/static/velocity-report-*-static > /tmp/velocity-static.sha256
          make build-radar-static
          sha256sum -c /tmp/velocity-static.sha256

      - name: Prepare Go build cache for saving
        id: go-cache-save
        env:
          GO_CACHE: ${{ runner.temp }}/go-build-cache
        run: |
          if [[ -d "$GO_CACHE.new" ]]; then
            rm -rf "$GO_CACHE"
            mv "$GO_CACHE.new" "$GO_CACHE"
            echo "Go build cache: $(du -sh "$GO_CACHE" | cut -f1)"
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Go build cache
        if: steps.go-cache-save.outputs.save == 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/go-build-cache
          key: ${{ steps.go-cache-key.outputs.key }}

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: velocity-report-static-binaries
          path: build/static/velocity-report-*-static
          retention-days: 14
