// Vendored from banshee-data/gerardus.
// Source commit: a365f0eacf67a18b27a51dacb7ad5cc2fbae8d9e.
// Retired OSM layer identities are reserved and must not be reused.
// Regenerate with make proto-gen-swift after synchronising this contract.

// Gerardus alignment API
// Version: v1alpha1 (may break until MVP 0 closes)
// Package: gerardus.align.v1alpha1
//
// The contract between the Gerardus service and its clients, first the macOS
// VelocityVisualiser in velocity.report. The service prepares reference data
// for a site (USGS 3DEP aerial LiDAR and DataSF building
// footprints), serves it as geometry in a site frame, and registers a sensor's
// settled background scan against it. Design notes and the alternatives
// considered: docs/INTERFACE-VISUALISER.md. Decision: docs/adr/0007.
//
// Frames. Every coordinate in this file is in one of three frames, and every
// field says which.
//
//   sensor  The frame of the scan the client uploads: velocity.report's
//           pipeline frame, in which its BackgroundSnapshot and
//           PointCloudFrame points are expressed. Right-handed, metres,
//           origin at the sensor, +Y along azimuth 0, +Z up when the sensor
//           is level.
//   site    Local Cartesian east-north-up at the site origin. The origin is
//           the centre of the site's S2 level-16 cell at NAVD88 height 0, so
//           z reads as orthometric (NAVD88) height to within millimetres
//           across a site.
//           +Y is true north at the origin. All site geometry is float32:
//           coordinates stay under 1 km, which float32 resolves to 0.1 mm.
//   world   Geodetic latitude and longitude in degrees, ellipsoidal height in
//           metres, on the datum the message names.
//
// Poses map sensor-frame points into the site frame:
//
//   p_site = R(rotation) * p_sensor + translation_m
//
// A client draws reference geometry in its sensor frame by applying the
// inverse of the current pose as a model matrix, so moving the pose never
// re-sends geometry.
//
// Site key. A site is named by the token of its S2 level-16 cell, the same
// key velocity.report uses for lidar_sites. Tokens are lower-case hex text.
//
// Reference preparation and serving exclude OpenStreetMap data. Retired
// layer numbers 2 and 4 are reserved; explicit requests for them fail with
// INVALID_ARGUMENT, including for older clients and cached bundles.
// Player identity and authorisation for map edits remain in gerardus.map.v1alpha1.

syntax = "proto3";

package gerardus.align.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/banshee-data/gerardus/internal/alignpb;alignpb";

// =============================================================================
// Services
// =============================================================================

// SiteService prepares and serves reference data for sites.
service SiteService {
  // Server version and what it can do. Clients call it on connect.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // Builds the reference bundle for a site, or returns the cached one at
  // once. Streams progress; the last message carries the site. Idempotent:
  // two concurrent calls for one site share one build, and a client that
  // disconnects does not cancel it.
  rpc PrepareSite(PrepareSiteRequest) returns (stream PrepareSiteResponse);

  // A prepared site. NOT_FOUND until PrepareSite has completed for it.
  rpc GetSite(GetSiteRequest) returns (GetSiteResponse);

  // Every prepared site.
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse);

  // Reference geometry for a prepared site, in the site frame, in chunks of
  // at most a few megabytes. Layers arrive in the order requested; each
  // layer's last chunk has layer_complete set. Retired OSM layers are
  // unsupported for every caller: INVALID_ARGUMENT before any message.
  rpc StreamReference(StreamReferenceRequest) returns (stream StreamReferenceResponse);

  // The site model: the site's scans with an accepted pose, newest record per
  // scan, and the model_id the registered layers are built from
  // (docs/plans/SITE-MODEL-SPIKE.md §6.1). Not built yet: UNIMPLEMENTED.
  rpc GetSiteModel(GetSiteModelRequest) returns (GetSiteModelResponse);

  // The site's street use as marked by operators: each feature's current
  // version (VECTOR-MAP §4.1).
  rpc ListStreetUse(ListStreetUseRequest) returns (ListStreetUseResponse);

  // Adds, changes or removes marked features in one transaction. Vertices
  // snap to kerbs, centrelines and other marks within 0.5 m; problems (a
  // lane across a kerb, a space in a lane, a driveway off any kerb, two
  // surfaces overlapping, a lane off the carriageway) come back as warnings
  // and do not block the edit. A SURFACE without a known surface tag is
  // refused. Rows are append-only. A TRAVEL_LANE's posted-limit tags are
  // validated (speed_limit with its unit, source, jurisdiction and effective
  // dates; docs/plans/LANES-AND-LIMITS.md §3.1), and Gerardus fills street,
  // cnn, bearing_deg and bound from its geometry; limit and direction
  // problems come back as warnings.
  rpc EditStreetUse(EditStreetUseRequest) returns (EditStreetUseResponse);

  // The site's lane fields summed in the site frame, one class group at a
  // time: the newest whole-run field of each capture, each placed by the
  // current pose of the scan its record accepted (LANE-PROPOSALS §3, §4.1).
  rpc GetLaneField(GetLaneFieldRequest) returns (GetLaneFieldResponse);

  // The travel lanes proposed from the site's lane fields, graded high or
  // medium, each with its lateral profiles, the authored lane that adopted
  // it and its latest review (LANE-PROPOSALS §4, §5.1). Derives them first
  // when the fields, the bundle or the derivation changed.
  rpc ListLaneProposals(ListLaneProposalsRequest) returns (ListLaneProposalsResponse);

  // Rejects a proposal, or reopens a rejected one: an append-only review
  // under INTERFACE-EDITS' contract (request_id, expected_row_id). An
  // approval is not a review: it is a TRAVEL_LANE saved with EditStreetUse
  // and tagged proposal=<feature_id>.
  rpc ReviewLaneProposal(ReviewLaneProposalRequest) returns (ReviewLaneProposalResponse);
}

// RegistrationService registers a sensor scan against a site and records the
// pose an operator accepts.
service RegistrationService {
  // Uploads a scan in the sensor frame: one header, then point blocks.
  // Content-addressed: the same header and points give the same scan_id, and
  // a repeat upload stores nothing new.
  rpc UploadScan(stream UploadScanRequest) returns (UploadScanResponse);

  // Uploads a lane field: velocity.report's aggregate of one run's tracks
  // in the sensor frame, one header, then cells by class group. No cell may
  // hold fewer than k = 5 distinct tracks (ADR-0011), and the header names
  // the accepted registration record that places it. Content-addressed: the
  // same header and cells give the same field_id, and a repeat stores nothing.
  rpc UploadLaneField(stream UploadLaneFieldRequest) returns (UploadLaneFieldResponse);

  // Converts an approximate position and heading (velocity.report's
  // eye-read site position and north azimuth) into a pose in the site frame,
  // with the height taken from the 3DEP ground model. The client uses it to
  // draw the reference before any registration has run.
  rpc PoseFromHint(PoseFromHintRequest) returns (PoseFromHintResponse);

  // Registers a scan against its site's 3DEP points: levels the scan by its
  // ground plane, searches 30 m around the start position and every heading
  // for where its facades and poles meet 3DEP's elevated structure, refines
  // the best distinct poses with point-to-plane ICP, scores them on
  // held-out points and gates the best (docs/INTERFACE-VISUALISER.md §7).
  // Streams progress and each distinct hypothesis as it converges; the last
  // message carries the registration, CANDIDATE when every gate passes,
  // else FAILED with its hypotheses, which an operator can still accept.
  // The start's heading is not used. A site without aerial data, or a scan
  // without a ground plane, gives a FAILED run with no hypotheses that
  // carries its initial pose, for placing the sensor by hand. The run is
  // logged even if the client goes away.
  rpc Register(RegisterRequest) returns (stream RegisterResponse);

  // Scores a pose against the reference: residual statistics, constraint
  // rank and optionally a residual per scan point for colouring. With refine
  // set, first runs local ICP from the pose. Fast enough to call when the
  // operator releases a drag, not on every frame of it.
  rpc EvaluatePose(EvaluatePoseRequest) returns (EvaluatePoseResponse);

  // Solves a pose from operator-picked correspondences between scan and
  // reference points. Three or more ties solve all six degrees of freedom;
  // two suffice with level set.
  rpc SolveTiePoints(SolveTiePointsRequest) returns (SolveTiePointsResponse);

  // A registration and its hypotheses.
  rpc GetRegistration(GetRegistrationRequest) returns (GetRegistrationResponse);

  // Records the operator's decision on a registration: accept one of its
  // hypotheses, accept an operator pose, or reject. Returns the immutable
  // record; a later review of the same scan supersedes it.
  rpc ReviewRegistration(ReviewRegistrationRequest) returns (ReviewRegistrationResponse);
  // Atomic review of a refinement or several scans in the same site.
  rpc ReviewRegistrations(ReviewRegistrationsRequest) returns (ReviewRegistrationsResponse);

  // Records for a site, newest first, for velocity.report to reconcile
  // against what it stored.
  rpc ListRegistrationRecords(ListRegistrationRecordsRequest) returns (ListRegistrationRecordsResponse);

  // Re-solves the accepted poses at a site together, as a small pose graph of
  // 3DEP priors and scan pairs (docs/plans/SITE-MODEL-SPIKE.md §6.4). Writes
  // one Registration per scan whose single hypothesis, "j1", is the jointly
  // refined pose; ReviewRegistration accepts it, and refuses with
  // FAILED_PRECONDITION once the scan's accepted pose has changed since the
  // refinement ran. Accept every j1 of one result together. Needs two
  // accepted scans and aerial data, else FAILED_PRECONDITION. Streams
  // progress; the last message carries the result.
  rpc RefineSite(RefineSiteRequest) returns (stream RefineSiteResponse);
}

// =============================================================================
// Geometry primitives
// =============================================================================

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Unit quaternion, Hamilton convention. Rotates child-frame vectors into the
// parent frame.
message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

message GeodeticPosition {
  double latitude_deg = 1;
  double longitude_deg = 2;
  // Above the datum's ellipsoid. Unset while the server has no geoid model
  // to convert with (SiteFrame.geoid_model empty).
  optional double ellipsoidal_height_m = 3;
  // NAVD88 height (EPSG:5703). Unset where it does not apply, as in a PoseHint.
  optional double orthometric_height_m = 4;
}

// Points as parallel arrays, the layout of velocity.report's PointCloudFrame
// and BackgroundSnapshot. x, y and z have equal length; every other array is
// empty or the same length as x.
message PointBlock {
  repeated float x = 1 [packed = true];
  repeated float y = 2 [packed = true];
  repeated float z = 3 [packed = true];

  // Reference points: ASPRS LAS 1.4 class (2 ground, 6 building, 17 bridge
  // deck, ...). Scans: empty.
  repeated uint32 classification = 4 [packed = true];

  // Reference points: LAS intensity, 16-bit. Scans: sensor intensity, 0-255.
  repeated uint32 intensity = 5 [packed = true];

  // Scans: how often the background grid saw the point
  // (BackgroundSnapshot.confidence, TimesSeenCount). The server weights by
  // it. Reference points: empty.
  repeated uint32 confidence = 6 [packed = true];
}

// =============================================================================
// Frames and poses
// =============================================================================

// SiteFrame states where the site frame is and which datums it sits on.
message SiteFrame {
  string frame_id = 1;              // "site/<l16 token>"
  string l16_token = 2;
  // Centre of the L16 cell at NAVD88 height 0. Its ellipsoidal height is
  // geoid_undulation_m, and is left unset while geoid_model is empty (no
  // geoid grid wired in yet).
  GeodeticPosition origin = 3;
  string horizontal_datum = 4;      // "EPSG:6318", NAD83(2011): the datum of 3DEP
  string vertical_datum = 5;        // "EPSG:5703", NAVD88 height
  string geoid_model = 6;           // "GEOID18"; empty when not applied
  double geoid_undulation_m = 7;    // N at the origin; ellipsoidal height = orthometric + N
  string working_crs = 8;           // "EPSG:7131": the projected CRS the server computes in
}

enum PoseSource {
  POSE_SOURCE_UNSPECIFIED = 0;
  POSE_SOURCE_HINT = 1;             // from an approximate position and heading (eye-read)
  POSE_SOURCE_MANUAL = 2;           // placed or nudged by an operator
  POSE_SOURCE_TIE_POINTS = 3;       // solved from operator-picked correspondences
  POSE_SOURCE_ICP = 4;              // registration output
  POSE_SOURCE_JOINT = 5;            // refined together with the site's other accepted scans (RefineSite)
}

// SensorPose places a sensor frame in a site frame.
message SensorPose {
  string site_frame_id = 1;         // "site/<l16 token>"
  string sensor_frame_id = 2;       // "sensor/<sensor_id>"
  Vector3 translation_m = 3;        // sensor origin in the site frame
  Quaternion rotation = 4;          // sensor axes in the site frame

  // 6x6, row-major, symmetric. Order: tx, ty, tz (metres, site axes), then
  // rx, ry, rz (radians, small rotations about the site axes applied on the
  // left: R' = exp([r]x) * R). Empty when unknown.
  repeated double covariance = 5 [packed = true];

  PoseSource source = 6;
}

// PoseSummary restates a pose in the terms an operator reads. Derived by the
// server; clients display it and never send it back.
message PoseSummary {
  double heading_deg = 1;           // azimuth of sensor +Y, clockwise from true north, [0, 360)
  double pitch_deg = 2;             // elevation of sensor +Y above the horizontal
  double roll_deg = 3;              // depression of sensor +X below the horizontal
  double height_above_ground_m = 4; // sensor origin above the 3DEP ground model
  GeodeticPosition position = 5;    // sensor origin on the site's horizontal datum
  double sigma_horizontal_m = 6;    // 1-sigma horizontal position from the covariance; 0 if unknown
  double sigma_heading_deg = 7;     // 1-sigma heading from the covariance; 0 if unknown
}

// OGC GeoPose 1.0 Basic-Quaternion: the sensor origin and the rotation of
// the sensor axes relative to the local east-north-up tangent plane there.
message GeoPose {
  GeodeticPosition position = 1;
  Quaternion orientation = 2;
  string crs = 3;                   // "EPSG:6319" NAD83(2011) or "EPSG:4979" WGS 84
  double epoch = 4;                 // decimal year of the coordinates; 0 for NAD83(2011)
}

// =============================================================================
// Sites and reference data
// =============================================================================

enum ReferenceLayer {
  reserved 2, 4;
  reserved "REFERENCE_LAYER_OSM", "REFERENCE_LAYER_INTERSECTIONS";
  REFERENCE_LAYER_UNSPECIFIED = 0;
  REFERENCE_LAYER_AERIAL_POINTS = 1;   // USGS 3DEP points
  // DataSF building footprints, draped, each moved by its box's footprint
  // shift (tags shift_east_m, shift_north_m: the published position is the
  // served one less the shift; docs/plans/ROOFLINE-WALLS.md §2).
  REFERENCE_LAYER_FOOTPRINTS = 3;
  // Accepted scans in the site frame, as ScanPoints. Served only by
  // `serve --serve-scans`, and only to loopback and tailnet peers (ADR-0011).
  REFERENCE_LAYER_REGISTERED_SCANS = 5;
  // Sensors and corrections from the records, plus the current proposed
  // features (ADR-0012), as line features.
  REFERENCE_LAYER_OBSERVED = 6;
  // The current ground-surface feature as a Heightfield: 3DEP, refined by
  // registered scans.
  REFERENCE_LAYER_GROUND_MESH = 7;
  // DataSF footprints as boxes (docs/plans/SITE-MODEL-SPIKE.md §6.6): each
  // wall a closed vertical polygon of kind BUILDING, from the 3DEP ground to
  // a roof height measured in 3DEP, moved by the site's footprint shift. Where
  // the building has LoD2 roof planes, the wall's top follows their roofline
  // instead (tag top=roofline; else top=box): no wall stands above the
  // gutter, and gable ends reach the ridge (docs/plans/ROOFLINE-WALLS.md).
  // Once the model is derived; registration reads the box walls. Tags: building_id,
  // wall, party, top, roof_p50_m, roof_p95_m, shift_east_m, shift_north_m.
  // Public data only.
  REFERENCE_LAYER_BOXES = 8;
  // DataSF street centrelines (Streets, PDDL), draped; retired segments are
  // kept with active=false (docs/plans/CITY-STREETS.md §3.2).
  REFERENCE_LAYER_CITY_STREETS = 9;
  // DataSF street nodes where three or more vehicle segments meet, as an
  // IntersectionSet (CITY-STREETS §3.3).
  REFERENCE_LAYER_CITY_INTERSECTIONS = 10;
  // Kerb and island lines: DataSF Curbs and Islands (PDDL), and kerbs
  // observed in registered scans. Tag source says which; observed ones are
  // ADR-0012 proposals (docs/plans/VECTOR-MAP.md W2).
  REFERENCE_LAYER_KERBS = 11;
  // What operators marked on the street: driveways, parked-car spaces,
  // travel lanes and ground surfaces (VECTOR-MAP §4.1, EditStreetUse).
  REFERENCE_LAYER_STREET_USE = 12;
  // LoD2 buildings (W4, docs/plans/BUILDINGS.md): each building part's
  // outline (BUILDING_PART), its roof faces (ROOF_PLANE) and its walls up to
  // the roofline (WALL_SURFACE), reconstructed from 3DEP inside the DataSF
  // footprints and refined by registered scans. Draw the roof planes and
  // the wall surfaces; extrude nothing.
  // Derived rows (ADR-0012, ADR-0015); the message names the model.
  REFERENCE_LAYER_BUILDINGS = 13;
  // Lane markings (W5): a public layer if the City publishes one, and
  // markings traced from scan and 3DEP intensity, as LANE_MARKING lines.
  REFERENCE_LAYER_LANE_MARKINGS = 14;
  // Street furniture (W6): City inventories (streetlights, signals, parking
  // meters, signs) and poles and signs fitted in the scans, as POLE and SIGN.
  REFERENCE_LAYER_STREET_FURNITURE = 15;
  // Trees (W7, ADR-0014): DataSF's Street Tree List and trunks and crowns
  // fitted in 3DEP and the scans, as TREE.
  REFERENCE_LAYER_TREES = 16;
  // Road surface preview (docs/plans/GGP-ROAD-PROTOTYPE.md): filled
  // carriageway patches fitted on 3DEP class-2 ground inside reviewed road
  // boundaries, as RoadSurfaceChunk messages. A derived preview of the
  // parametric road (ADR-0017), not its canonical form. Sent only when a
  // request names it, never in the empty-request default, and advertised by
  // GetServerInfoResponse.road_surface_version.
  REFERENCE_LAYER_ROAD_SURFACE = 17;
}

// SourceInfo names one input and the terms it came under. A client that
// shows a layer shows its attribution.
message SourceInfo {
  ReferenceLayer layer = 1;
  string name = 2;                  // "USGS 3DEP CA_SanFrancisco_1_B23"
  string uri = 3;
  string version = 4;               // acquisition date or dataset revision
  string licence = 5;               // SPDX id where one exists: "ODbL-1.0", "PDDL-1.0"; "public-domain"
  string attribution = 6;           // source attribution
  google.protobuf.Timestamp retrieved_at = 7;
  string sha256 = 8;                // of the retrieved data as stored
}

message LayerSummary {
  ReferenceLayer layer = 1;
  uint64 item_count = 2;            // points, features or intersections
}

// Site is a prepared reference bundle. bundle_id changes whenever any input
// changes, so a registration names exactly the data it ran against.
message Site {
  string l16_token = 1;
  string label = 2;                 // human name, e.g. "columbus-broadway"; provenance only
  SiteFrame frame = 3;
  repeated string covering_l16_tokens = 4;  // the cell and its 8 neighbours: the bundle's extent
  repeated LayerSummary layers = 5;
  repeated SourceInfo sources = 6;
  string bundle_id = 7;             // "sha256:<hex>" of the bundle manifest
  google.protobuf.Timestamp prepared_at = 8;
}

enum FeatureKind {
  FEATURE_KIND_UNSPECIFIED = 0;
  FEATURE_KIND_ROAD = 1;            // vehicle street centreline
  FEATURE_KIND_PATH = 2;            // footway, cycleway or path
  FEATURE_KIND_KERB = 3;            // kerb lines
  FEATURE_KIND_RAIL = 4;            // tram, rail or light rail
  FEATURE_KIND_BUILDING = 5;        // footprint outline, closed
  FEATURE_KIND_SENSOR = 6;          // a registered sensor: stalk from the ground to the origin, then a +Y arrow
  FEATURE_KIND_CORRECTION = 7;      // from a run's initial pose to the accepted pose
  FEATURE_KIND_FACADE = 8;          // a wall trace seen at street level by registered scans; height_m is its observed top
  FEATURE_KIND_POLE = 9;            // vertical segment, base to top
  // A wall plane measured by registered scans against a box wall: a closed
  // vertical rectangle (4 vertices). Tag role is "wall" (the wall itself) or
  // "popout" / "recess" (a part standing out or back, such as a bay window);
  // offset_m is its distance in front of the box wall.
  FEATURE_KIND_WALL_PLANE = 10;
  // Marked by an operator (STREET_USE). A driveway is a span of kerb, as a
  // two-vertex line along it; a parked-car space a closed polygon on the
  // ground (tags space_type: metered, permit, loading, disabled, free;
  // count; time_limit); a travel lane a centreline in its direction of
  // travel (tags lane_type: general, bus, bike, turn; width_m).
  FEATURE_KIND_DRIVEWAY = 11;
  FEATURE_KIND_PARKING_SPACE = 12;
  FEATURE_KIND_TRAVEL_LANE = 13;
  // A traffic island's outline, closed (KERBS).
  FEATURE_KIND_ISLAND = 14;
  FEATURE_KIND_OTHER = 15;
  // Marked by an operator (STREET_USE): a closed polygon saying what a piece
  // of ground is. Tag surface is "carriageway" (road surface between the
  // kerbs, where lanes are drawn), "sidewalk", "verge" (planting strip or
  // tree well), "apron" (a driveway's ramp across the sidewalk) or "median".
  FEATURE_KIND_SURFACE = 16;
  // A roof face of a building part (BUILDINGS): a closed planar polygon with
  // its z. Tags part (the BUILDING_PART's feature_id), slope_deg,
  // azimuth_deg (downslope, degrees clockwise from true north), role
  // ("roof"; "parapet" for a false front's top or a parapet standing on the
  // roof along a street edge; "lid" for the level top of a part without
  // faces, such as a bay, so its walls do not stand open).
  FEATURE_KIND_ROOF_PLANE = 17;
  // A building part (BUILDINGS): its outline, closed, at its base (z is
  // min_height above the ground, or the ground). Tags use OSM's Simple 3D
  // Buildings keys verbatim where they apply (roof:shape, roof:height,
  // roof:direction, roof:orientation, roof:angle, height, min_height,
  // building:levels) and gms:* keys otherwise (gms:roof_shape=unknown with
  // gms:roof_shape_candidate, gms:roof_shape_confidence, gms:false_front,
  // gms:parapet_height_m, gms:footprint); see BUILDINGS.md's mapping.
  // roof:height is height less the eave for every shape but flat (0, as OSM
  // has it; a flat part's walls stop at its roofline). height_m is 0 from
  // derivation 11: the outline is not for extrusion, its WALL_SURFACEs are
  // its walls.
  FEATURE_KIND_BUILDING_PART = 18;
  // A painted marking (LANE_MARKINGS) as a polyline on the road, or a closed
  // polygon for an area marking. Tags marking: lane_line, centre_line,
  // edge_line, stop_line, crosswalk, bike_lane, arrow, other; pattern: solid,
  // dashed, double; colour: white, yellow.
  FEATURE_KIND_LANE_MARKING = 19;
  // A sign (STREET_FURNITURE): a vertical segment from the bottom to the
  // top of its face. Tags sign_type when known, pole (the POLE it is on).
  // POLE (9) is a pole: base to top, with tags pole_type (streetlight,
  // signal, meter, utility, sign, other) and diameter_m.
  FEATURE_KIND_SIGN = 20;
  // A tree (TREES): a vertical segment from the trunk's base to the crown's
  // base. Tags dbh_m, height_m, crown_base_m, crown_radius_m, species, and
  // datasf_id for a Street Tree List match.
  FEATURE_KIND_TREE = 21;
  // A wall of a building part (BUILDINGS, docs/plans/ROOFLINE-WALLS.md): a
  // closed vertical polygon whose bottom edge stands on the ground (or at
  // min_height) and whose top edge follows the roofline. height_m is 0: the
  // vertices carry their z; never extrude it. Tags part (the BUILDING_PART's
  // feature_id), gms:footprint, edge (the part ring's edge it stands on, for
  // wall, gable and party), role ("wall": its top is an eave; "gable": its
  // top rises to a ridge; "step": inside the part, between two roof faces at
  // different heights; "party": shared with another part, only what stands
  // above the lower roof, or a wall's top standing on the roof anywhere but
  // a street edge, from the roof up to its top), top ("roofline"; "flat"
  // for a part without roof faces, whose wall stops at height).
  FEATURE_KIND_WALL_SURFACE = 22;
}

message LineFeature {
  string feature_id = 1;            // "datasf:ynuv-fyni/<id>"
  FeatureKind kind = 2;
  repeated float xyz = 3 [packed = true];  // site-frame vertices, interleaved x, y, z
  bool closed = 4;                  // last vertex joins the first
  float height_m = 5;               // extrusion above the vertices for buildings; 0 if unknown
  map<string, string> tags = 6;     // source tags worth showing: name, highway, lanes, oneway
  string source_version = 7;        // source-qualified feature revision
}

message LineFeatureSet {
  repeated LineFeature features = 1;
}

message Approach {
  float bearing_deg = 1;            // direction a vehicle travels in on entering, clockwise from true north
  string way_feature_id = 2;        // the street feature the approach is on
  string name = 3;                  // street name
}

message Intersection {
  string intersection_id = 1;       // "datasf:intersection/<id>"
  Vector3 position = 2;             // site frame, draped
  repeated Approach approaches = 3;
  string name = 4;                  // "Columbus Ave & Broadway"
}

message IntersectionSet {
  repeated Intersection intersections = 1;
}

// One block of a registered scan, placed by an accepted record.
message ScanPoints {
  string scan_id = 1;
  string record_id = 2;             // the accepted record whose pose placed these points
  ScanKind kind = 3;
  string capture_ref = 4;
  PointBlock points = 5;            // site frame
}

// A ground surface on a regular grid, drawn as a wireframe (no triangle mesh).
// Row-major from the south-west corner: z[j * nx + i] is the cell centre at
// origin + (i * cell_m, j * cell_m).
message Heightfield {
  Vector3 origin = 1;               // site frame, south-west cell centre
  float cell_m = 2;
  uint32 nx = 3;
  uint32 ny = 4;
  repeated float z = 5 [packed = true];  // NaN where there is no ground
}

// =============================================================================
// Scans and registration
// =============================================================================

enum ScanKind {
  SCAN_KIND_UNSPECIFIED = 0;
  SCAN_KIND_BACKGROUND = 1;         // a settled background snapshot
  // Background- and ground-classed points of N replayed frames, sensor frame.
  SCAN_KIND_ACCUMULATED = 2;
  // A merged map (SLAM) in its own map frame; Register skips the range cut.
  SCAN_KIND_MAP = 3;
}

message ScanHeader {
  string l16_token = 1;
  string sensor_id = 2;             // "hesai-01"; the sensor frame is "sensor/<sensor_id>"
  string sensor_model = 3;          // "hesai-pandar40p"
  ScanKind kind = 4;
  string capture_ref = 5;           // velocity.report's name for the capture: replay case id or archive stem
  google.protobuf.Timestamp captured_at = 6;
  uint64 background_sequence = 7;   // BackgroundSnapshot.sequence_number
  // Where things that move were seen while the scan was gathered (tracked
  // objects' boxes, sensor frame). Gerardus drops scan points inside them
  // before a scan joins the site model (VECTOR-MAP W3).
  repeated Box3 transient = 8;
}

// An oriented box: centre and size in metres, turned about +Z by heading_rad
// (counter-clockwise from +X). Its frame is the message's.
message Box3 {
  Vector3 centre = 1;
  Vector3 size_m = 2;
  double heading_rad = 3;
  string label = 4;                 // the tracker's class, e.g. "car"
}

message Scan {
  string scan_id = 1;               // "sha256:<hex>" over the header and points
  ScanHeader header = 2;
  uint64 point_count = 3;
}

// The approximate placement velocity.report holds before registration.
message PoseHint {
  GeodeticPosition position = 1;    // WGS 84; the height is ignored
  // Azimuth of sensor +Y, clockwise from true north. From velocity.report's
  // site-index north_azimuth_deg N this is 180 - N (docs/INTERFACE-VISUALISER.md §3).
  optional double heading_deg = 2;
  optional double mount_height_m = 3;  // sensor above ground; server default when absent
}

message RegistrationOptions {
  // Re-runs from seeds spread around the best pose: each a local search and
  // ICP; the seed_agreement gate counts those ending within 0.10 m and 0.5
  // degrees of it.
  uint32 seed_count = 1;            // default 20
  float seed_translation_m = 2;     // seeds are spread +/- this in x and y; default 5
  float seed_yaw_deg = 3;           // and +/- this in heading; default 30
  float max_correspondence_m = 4;   // default 1.0
  uint64 random_seed = 5;           // makes a run repeatable; default 1
  // Horizontal search and result radius from initial_pose, 1–30 m.
  // 0 preserves the server's default (including its environment setting).
  float search_radius_m = 6;
}

// One converged pose, with the evidence for it.
message Hypothesis {
  string hypothesis_id = 1;
  SensorPose pose = 2;
  PoseSummary summary = 3;
  FitQuality quality = 4;
  uint32 seeds_converged = 5;       // seeds that ended within 0.10 m and 0.5 degrees of this pose
  uint32 seeds_total = 6;
}

// FitQuality scores a pose. Residuals are point-to-plane distances from scan
// points to the reference, on points held out of the fit.
message FitQuality {
  uint32 points_used = 1;
  float inlier_fraction = 2;
  float ground_p50_m = 3;
  float ground_p95_m = 4;
  float facade_p50_m = 5;
  // Reported, not gated: San Francisco facades put recesses, glass and bay
  // windows in the tail whatever the pose (docs/INTERFACE-VISUALISER.md §7).
  float facade_p95_m = 6;
  float rmse_m = 7;

  // Eigenvalues of the 6x6 point-to-plane information matrix, ascending,
  // in the covariance order of SensorPose. A small one means the reference
  // does not pin that direction down (a straight corridor leaves translation
  // along the street free).
  repeated double information_eigenvalues = 8 [packed = true];
  uint32 constraint_rank = 9;       // eigenvalues above the server's threshold; 6 is full
  repeated string weak_directions = 10;  // human-readable, e.g. "translation along 23 deg"
  float facade_p75_m = 11;
  // How fast facade residuals grow with range: the Theil-Sen slope of
  // |residual| against distance from the sensor, metres per metre. A heading
  // error of a radians adds up to a metres per metre; facade geometry does
  // not grow with range. NaN with fewer than 100 facade residuals.
  float facade_range_slope = 12;

  // Residuals against what the request added to 3DEP alone: the site's
  // accepted scans (against_site_model) and/or its corrected box walls
  // (against_boxes). Reported, not gated.
  float model_p50_m = 13;
  float model_p75_m = 14;
  uint32 model_points = 15;
}

// One acceptance gate and how the pose did against it.
message GateResult {
  string name = 1;                  // "ground_p95_m", "facade_p75_m", "facade_range_slope", "constraint_rank", "hypothesis_separation", "seed_agreement"
  double value = 2;
  double threshold = 3;
  bool passed = 4;
}

enum RegistrationState {
  REGISTRATION_STATE_UNSPECIFIED = 0;
  REGISTRATION_STATE_RUNNING = 1;
  REGISTRATION_STATE_CANDIDATE = 2;        // gates passed; awaiting review
  REGISTRATION_STATE_FAILED = 3;           // no hypothesis passed the gates
  REGISTRATION_STATE_REGISTERED = 4;       // a candidate hypothesis accepted by an operator
  REGISTRATION_STATE_MANUALLY_PLACED = 5;  // an operator pose accepted, or a hypothesis that failed a gate
  REGISTRATION_STATE_REJECTED = 6;
}

message Registration {
  string registration_id = 1;       // "gms:<ulid>"
  string l16_token = 2;
  string scan_id = 3;
  string bundle_id = 4;
  RegistrationState state = 5;
  repeated Hypothesis hypotheses = 6;  // ranked, best first
  repeated GateResult gates = 7;       // evaluated on hypotheses[0]
  string failure_reason = 8;
  RegistrationOptions options = 9;     // as run, defaults filled in
  SensorPose initial_pose = 10;
  string server_version = 11;
  google.protobuf.Timestamp created_at = 12;
  string refinement_id = 21;       // identifies one joint solve
  map<string, string> refinement_heads = 20; // scan id -> accepted record id; atomic acceptance required
}

message Progress {
  string stage = 1;                 // "aerial", "footprints", "streets", "coarse", "icp", "gates"
  float fraction = 2;               // 0 to 1 within the stage; negative when unknown
  string message = 3;
}

message TiePoint {
  Vector3 sensor_point = 1;         // picked in the scan, sensor frame
  Vector3 site_point = 2;           // picked in the reference, site frame
  string label = 3;
}

message RegistrationRecord {
  string record_id = 1;             // "gms:<ulid>"
  string registration_id = 2;
  RegistrationState state = 3;      // REGISTERED, MANUALLY_PLACED or REJECTED
  string l16_token = 4;
  string scan_id = 5;
  string capture_ref = 6;
  string sensor_id = 7;
  SiteFrame site_frame = 8;
  SensorPose pose = 9;              // unset when rejected
  PoseSummary summary = 10;
  GeoPose geopose = 11;             // on the site's datum, NAD83(2011)
  GeoPose geopose_wgs84 = 12;       // for web maps
  FitQuality quality = 13;
  repeated GateResult gates = 14;
  string reviewer = 15;
  string note = 16;
  google.protobuf.Timestamp reviewed_at = 17;
  string bundle_id = 18;
  repeated SourceInfo sources = 19;
  string server_version = 20;
  string supersedes_record_id = 21; // the previous record for this scan, if any
}

// =============================================================================
// Requests and responses
// =============================================================================

message GetServerInfoRequest {}

message GetServerInfoResponse {
  string server_version = 1;
  string api_version = 2;           // "gerardus.align.v1alpha1"
  // Layers this server can build and send this caller: aerial needs an
  // indexed dataset and city layers need their configured source endpoints.
  repeated ReferenceLayer available_layers = 3;
  RegistrationOptions default_options = 4;
  // The street and intersection layers fusion products read by default
  // (ADR-0009): CITY_STREETS and CITY_INTERSECTIONS.
  ReferenceLayer default_streets = 5;
  ReferenceLayer default_intersections = 6;
  // Supports search_radius_m on Register/EvaluatePose and Register.manual_only.
  bool supports_bounded_placement = 7;
  // Supports UploadLaneField, GetLaneField, ListLaneProposals and
  // ReviewLaneProposal (ADR-0016).
  bool supports_lane_fields = 8;
  // The street-use rules the server applies; 0 on an older server, which
  // passes limit tags through unchecked. 1: LANES-AND-LIMITS §3.1–3.3.
  uint32 street_use_rules_version = 9;
  // The city view tiles (CITY-VIEW-TILES), served over HTTP on this
  // server's own address: GET <city_tiles_path>tileset.json, the tiles'
  // URIs relative to it. "/city-tiles/<epoch>/", immutable per epoch; empty
  // when this server has no baked tiles.
  string city_tiles_path = 10;
  string city_tiles_epoch = 11;
  // The road surface preview contract this server speaks
  // (REFERENCE_LAYER_ROAD_SURFACE, RoadSurfaceChunk): 0 on a server without
  // it, whose StreamReference answers layer 17 with an empty, complete
  // layer, or with INVALID_ARGUMENT ("unknown layer 17") on one older than
  // the enum value. 1: GGP-ROAD-PROTOTYPE. The layer is also listed in
  // available_layers when this server has road previews to send.
  uint32 road_surface_version = 12;
}

message PrepareSiteRequest {
  string l16_token = 1;
  string label = 2;
  bool refresh = 3;                 // fetch every source again even when cached
}

message PrepareSiteResponse {
  oneof event {
    Progress progress = 1;
    Site site = 2;                  // last message
  }
}

message GetSiteRequest {
  string l16_token = 1;
}

message GetSiteResponse {
  Site site = 1;
}

message ListSitesRequest {}

message ListSitesResponse {
  repeated Site sites = 1;
}

message StreamReferenceRequest {
  string l16_token = 1;
  // Empty: every retained bundle layer, in enum order.
  repeated ReferenceLayer layers = 2;
  Vector3 centre = 3;               // site frame; unset: the origin
  // Horizontal; 0: the whole bundle. Only a filter on what is sent: a client
  // that wants complete tiles (covering_l16_tokens) asks for the whole bundle.
  float radius_m = 4;
  // Aerial thinning: the server sends every EPT level of detail whose
  // nominal spacing is at least this, so never denser than asked.
  // 0: server default (0.50 m).
  float voxel_size_m = 5;
  repeated uint32 aerial_classes = 6;  // ASPRS classes to send; empty: all but noise (7, 18)
  // 0: server default (65536). Larger requests are capped at 246720 so
  // worst-case class/intensity encodings fit the default 4 MiB gRPC limit.
  uint32 max_points_per_message = 7;
  // REFERENCE_LAYER_BOXES (W4b): "outline" (or empty, the default) keeps the
  // walls on DataSF's roofprints; "adjusted" moves each wall in by its eave
  // inset, to its wall plane where one measures it. Either way each wall,
  // once the model is derived, carries inset_m, inset_source (measured,
  // building, block, none), inset_count and walls (outline or adjusted).
  string walls = 9;
}

message StreamReferenceResponse {
  ReferenceLayer layer = 1;
  oneof payload {
    PointBlock points = 2;
    LineFeatureSet lines = 3;
    IntersectionSet intersections = 4;
    ScanPoints scan_points = 6;     // REFERENCE_LAYER_REGISTERED_SCANS
    Heightfield ground_mesh = 7;    // REFERENCE_LAYER_GROUND_MESH
    RoadSurfaceChunk road_surface = 9;  // REFERENCE_LAYER_ROAD_SURFACE
  }
  bool layer_complete = 5;          // last chunk of this layer
  // The site model the registered layers (REGISTERED_SCANS, OBSERVED,
  // GROUND_MESH) were built from; empty on other layers.
  string model_id = 8;
}

message UploadScanRequest {
  oneof part {
    ScanHeader header = 1;          // first message only
    PointBlock points = 2;          // then any number, sensor frame
  }
}

message UploadScanResponse {
  Scan scan = 1;
  bool already_stored = 2;
}

message PoseFromHintRequest {
  string l16_token = 1;
  string sensor_id = 2;
  PoseHint hint = 3;
}

message PoseFromHintResponse {
  SensorPose pose = 1;
  PoseSummary summary = 2;
}

message RegisterRequest {
  string scan_id = 1;               // the scan names its site
  // Where to start. Unset: the server starts from hint and from the
  // candidate intersections' bearings.
  SensorPose initial_pose = 2;
  PoseHint hint = 3;
  RegistrationOptions options = 4;  // unset fields take the server defaults
  bool against_site_model = 5;      // also fit against the site's accepted scans
  // Also fit against the site's DataSF box walls, corrected by the measured
  // wall planes where they exist (docs/plans/SITE-MODEL-SPIKE.md §10 q7).
  bool against_boxes = 6;
  // Persist initial_pose for an operator decision, without searching or
  // generating hypotheses. Requires initial_pose; state is MANUALLY_PLACED.
  bool manual_only = 7;
}

message RegisterResponse {
  oneof event {
    Progress progress = 1;
    Hypothesis hypothesis = 2;      // each distinct hypothesis as it converges
    Registration registration = 3;  // last message
  }
}

message EvaluatePoseRequest {
  string scan_id = 1;
  SensorPose pose = 2;
  bool refine = 3;                  // run local ICP from pose first
  bool include_point_residuals = 4;
  // When refining, refuse a result outside this horizontal radius of pose.
  // 1–30 m; 0 leaves local ICP unbounded for older clients.
  float search_radius_m = 5;
}

message EvaluatePoseResponse {
  SensorPose pose = 1;              // refined when refine was set, else the input
  PoseSummary summary = 2;
  FitQuality quality = 3;
  // One per scan point, in upload order: signed point-to-plane distance to
  // the reference in metres, NaN where no reference lies within
  // max_correspondence_m. Empty unless requested.
  repeated float point_residuals_m = 4 [packed = true];
}

message SolveTiePointsRequest {
  string l16_token = 1;
  string sensor_id = 2;
  repeated TiePoint tie_points = 3;
  // Hold pitch and roll level to the ground: the scan's ground plane is
  // matched to the 3DEP ground and the ties solve x, y, z and heading.
  // Needs scan_id.
  bool level = 4;
  string scan_id = 5;               // optional; when set, the pose is also scored
}

message SolveTiePointsResponse {
  SensorPose pose = 1;
  PoseSummary summary = 2;
  repeated float tie_residuals_m = 3 [packed = true];  // per tie, in request order
  FitQuality quality = 4;           // when scan_id was set
}

message GetRegistrationRequest {
  string registration_id = 1;
}

message GetRegistrationResponse {
  Registration registration = 1;
}

message ReviewRegistrationRequest {
  string registration_id = 1;
  oneof decision {
    string accept_hypothesis_id = 2;  // REGISTERED if it passed the gates, else MANUALLY_PLACED
    SensorPose accept_pose = 3;       // an operator pose: MANUALLY_PLACED
    string reject_reason = 4;         // REJECTED
    string revert_record_id = 9;      // compensate by restoring this scan's historical record
  }
  string reviewer = 5;
  string note = 6;
  optional string expected_record_id = 7; // required; empty means no previous review
  string request_id = 8;             // required for single review; stable across retries
}

message ReviewRegistrationResponse {
  RegistrationRecord record = 1;
}

message ReviewRegistrationsRequest {
  string request_id = 1;
  repeated ReviewRegistrationRequest reviews = 2; // all at one site, one per scan
}
message ReviewRegistrationsResponse { repeated RegistrationRecord records = 1; }

message ListRegistrationRecordsRequest {
  string l16_token = 1;
}

message ListRegistrationRecordsResponse {
  repeated RegistrationRecord records = 1;
}

message GetSiteModelRequest {
  string l16_token = 1;
}

// A scan in the site model, placed by its newest accepted record.
message ModelScan {
  string scan_id = 1;
  string record_id = 2;
  ScanKind kind = 3;
  string capture_ref = 4;
  RegistrationState state = 5;      // REGISTERED or MANUALLY_PLACED
  SensorPose pose = 6;
  uint64 point_count = 7;
}

message GetSiteModelResponse {
  // "sha256:<hex>" over the bundle_id and the accepted record ids: changes
  // when a record is accepted or superseded.
  string model_id = 1;
  string bundle_id = 2;
  repeated ModelScan scans = 3;
  DerivedBuildStatus derived_build = 4; // background geometry build; absent on older servers
}

// Source preparation and derived geometry have separate readiness. A READY
// status is for these exact inputs; a parking mask can change model_id here
// without changing the registered-scan model_id above. No old layer is served
// as if it belonged to newer inputs.
message DerivedBuildStatus {
  enum State {
    STATE_UNSPECIFIED = 0; // no build queued in this server process
    QUEUED = 1;
    BUILDING = 2;
    READY = 3;
    FAILED = 4;
    STALE = 5;
  }
  State state = 1;
  string bundle_id = 2;
  string model_id = 3;
  string error = 4;
}

message RefineSiteRequest {
  string l16_token = 1;
  repeated string scan_ids = 2;     // empty: every accepted scan at the site; two at least
  RegistrationOptions options = 3;
  // Independent residuals each fit is taken to have when weighting the
  // graph's factors; 0: the default, 500 (SITE-MODEL-SPIKE.md §10 q2).
  double n_eff = 4;
}

message RefinedScan {
  string scan_id = 1;
  string registration_id = 2;       // the run written for this scan; accept its hypothesis "j1"
  SensorPose before = 3;
  SensorPose after = 4;
  double delta_m = 5;
  double delta_deg = 6;
  FitQuality before_quality = 7;    // against 3DEP alone
  FitQuality after_quality = 8;
  uint32 joint_constraint_rank = 9; // from the node's marginal information in the graph
  repeated string joint_weak_directions = 10;
}

// A pair of scans the refinement matched against each other.
message ScanPair {
  string scan_a = 1;                // the scan fitted against
  string scan_b = 2;                // the scan fitted
  uint32 matched = 3;
  float p75_before_m = 4;
  float p75_after_m = 5;
  bool used = 6;
  string reason = 7;                // why a pair was left out
}

message RefineSiteResult {
  string model_id = 1;              // the model refined (before acceptance)
  repeated RefinedScan scans = 2;
  repeated ScanPair pairs = 3;
  uint32 iterations = 4;
  double cost_before = 5;
  double cost_after = 6;
  double n_eff = 7;                 // the weighting the graph ran with
}

message RefineSiteResponse {
  oneof event {
    Progress progress = 1;
    RefineSiteResult result = 2;    // last message
  }
}

// One operator-marked feature (STREET_USE) in the site frame, at its current
// version.
message StreetUseFeature {
  string feature_id = 1;            // "gms:<ulid>", kept across versions; empty on a new feature
  FeatureKind kind = 2;             // DRIVEWAY, PARKING_SPACE, TRAVEL_LANE or SURFACE
  repeated float xyz = 3 [packed = true];  // site frame, interleaved, draped on the ground
  bool closed = 4;
  map<string, string> tags = 5;
  string author = 6;
  google.protobuf.Timestamp edited_at = 7;
  string row_id = 8;                // this version
}

message StreetUseEdit {
  optional string expected_row_id = 4; // required on update/remove/revert; empty on create
  oneof change {
    StreetUseFeature upsert = 1;    // new when feature_id is empty, else a new version
    string remove_feature_id = 2;
    string revert_row_id = 3;        // compensate with an immutable historical version
  }
}

message ListStreetUseRequest {
  string l16_token = 1;
}

message ListStreetUseResponse {
  repeated StreetUseFeature features = 1;
}

message EditStreetUseRequest {
  string l16_token = 1;
  string author = 2;                // required
  string note = 3;
  repeated StreetUseEdit edits = 4;
  string request_id = 5;             // required, stable across exact retries
}

message StreetUseProblem { string feature_id = 1; string code = 2; string message = 3; }

message EditStreetUseResponse {
  repeated StreetUseProblem detailed_problems = 3;
  repeated StreetUseFeature features = 1;  // every current feature after the edit
  repeated string problems = 2;     // validation warnings, by feature id
}

// A lane field (docs/plans/LANE-PROPOSALS.md §3): what distinct tracks did in
// each 0.25 m cell of the sensor's horizontal plane over one run, or one half
// of it, per class group. Counts only: no track, track id or per-object
// sample (ADR-0011).
message LaneFieldHeader {
  string l16_token = 1;
  string sensor_id = 2;              // the sensor frame is "sensor/<sensor_id>"
  string record_id = 3;              // the accepted registration record that places the field
  string capture_ref = 4;            // velocity.report's capture or run id
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
  string window_part = 7;            // "all", "first_half", "second_half"
  float cell_m = 8;                  // 0.25
  Vector3 origin = 9;                // sensor frame, south-west cell centre; z unused
  uint32 nx = 10;
  uint32 ny = 11;
  uint32 k = 12;                     // 5 or more: no cell under this many distinct tracks
  string pipeline_build = 13;        // velocity.report build_version and git sha
  string tuning_fingerprint = 14;
  uint32 track_count = 15;           // distinct tracks that contributed, all groups
}

// One class group's cells, sparse, as parallel arrays.
message LaneFieldCells {
  string class_group = 1;            // "vehicle", "cyclist", "pedestrian"
  repeated uint32 ix = 2 [packed = true];
  repeated uint32 iy = 3 [packed = true];
  repeated uint32 tracks = 4 [packed = true];      // distinct tracks whose centre fell in the cell, observed instants
  repeated uint32 box_tracks = 5 [packed = true];  // distinct tracks whose box covered the cell's centre
  // 8 per cell: distinct tracks by heading, 45° bins clockwise from the
  // frame's +Y (the sensor's in an upload, true north in GetLaneField),
  // counted only while moving at 2 m/s or more.
  repeated uint32 heading = 6 [packed = true];
  repeated float speed_sum_mps = 7 [packed = true]; // sum of each counted track's mean speed in the cell
}

message LaneFieldCellSet {
  repeated LaneFieldCells groups = 1;
}

message UploadLaneFieldRequest {
  oneof part {
    LaneFieldHeader header = 1;     // first message only
    LaneFieldCells cells = 2;       // then any number; a group may span several
  }
}

message UploadLaneFieldResponse {
  string field_id = 1;              // "sha256:<hex>" over the header and cells
  uint32 cells = 2;
  bool already_stored = 3;
}

message GetLaneFieldRequest {
  string l16_token = 1;
  string class_group = 2;           // "vehicle" when empty
}

message GetLaneFieldResponse {
  Vector3 origin = 1;               // site frame, south-west cell centre
  float cell_m = 2;
  uint32 nx = 3;
  uint32 ny = 4;
  LaneFieldCells cells = 5;         // ix, iy from origin; heading bins clockwise from true north
  repeated string field_ids = 6;    // the fields summed
  uint32 captures = 7;
  uint32 track_count = 8;
}

// The evidence a proposal was read from at one station: the smoothed
// density of distinct vehicle tracks across the lane.
message LateralProfile {
  float station_m = 1;              // arc length along the proposal
  Vector3 centre = 2;               // site frame
  float bearing_deg = 3;            // direction of travel there, clockwise from true north
  repeated float offset_m = 4 [packed = true];  // across the lane, positive to the left of travel
  repeated float tracks = 5 [packed = true];    // smoothed distinct-track density at each offset
}

message LateralProfileSet {
  repeated LateralProfile profiles = 1;
}

enum LaneProposalDecision {
  LANE_PROPOSAL_DECISION_UNSPECIFIED = 0;
  LANE_PROPOSAL_DECISION_REJECTED = 1;
  LANE_PROPOSAL_DECISION_REOPENED = 2;
}

message LaneProposalReview {
  string review_id = 1;             // "gms:<ulid>"
  string feature_id = 2;            // the proposal reviewed
  string proposal_row_id = 3;       // the proposal row the reviewer read
  LaneProposalDecision decision = 4;
  string author = 5;
  string note = 6;
  google.protobuf.Timestamp reviewed_at = 7;
  string supersedes_review_id = 8;
}

// A proposed travel lane (ADR-0016): an ADR-0012 row whose id is kept across
// re-derivation. Its line is a TRAVEL_LANE in the site frame, in the
// direction of travel, with tags source=lane_field, confidence (high,
// medium), lane_type, width_m, tracks, stations, spread_m, agreement,
// windows_agree_m, bearing_deg, bound, street, cnn, marking_edges,
// turning_cells, pedestrian_crossings and fields.
message LaneProposal {
  string feature_id = 1;
  string row_id = 2;
  LineFeature line = 3;
  repeated LateralProfile profiles = 4;
  string adopted_by = 5;            // the authored travel lane running along it, if any
  LaneProposalReview review = 6;    // the latest review, if any
}

message ListLaneProposalsRequest {
  string l16_token = 1;
}

message ListLaneProposalsResponse {
  repeated LaneProposal proposals = 1;
  string model_id = 2;              // the lane model they were derived for
  repeated string field_ids = 3;
}

message ReviewLaneProposalRequest {
  string l16_token = 1;
  string feature_id = 2;
  LaneProposalDecision decision = 3;
  string author = 4;                // required
  string note = 5;
  string request_id = 6;            // required, stable across exact retries
  optional string expected_row_id = 7; // required: the proposal row the reviewer read
}

message ReviewLaneProposalResponse {
  LaneProposalReview review = 1;
  LaneProposal proposal = 2;
}

// =============================================================================
// Road surface preview (REFERENCE_LAYER_ROAD_SURFACE, road_surface_version 1)
// =============================================================================
//
// docs/plans/GGP-ROAD-PROTOTYPE.md, docs/INTERFACE-VISUALISER.md §14. A
// prototype contract: the support classes, boundary provenance, the layer
// number and the residual method are meant to last; the 0.5 m grid, this
// mesh payload and the use of Site.frame are scaffolding the parametric
// road (SPEC-ROAD-SURFACE) replaces.
//
// Frames. Patches are fitted in EPSG:7131 (NAD83(2011) / San Francisco
// CS13, metres) with NAVD88 heights, from shared inputs, then moved into the
// requesting site's frame in double precision and sent as float32. The same
// physical vertex sent through two neighbouring sites' frames lands on the
// same world position, to the precision RoadSurfaceLayer.frame_accuracy_m
// states. Hashes are computed in EPSG:7131, so they do not depend on the
// site a patch came through.
//
// Chunking. The first message for each corridor carries its
// RoadSurfaceLayer and may carry patches; the patches that follow belong to
// the most recent header until the next one. Every patch is whole inside one message: a patch never
// spans messages, and the server splits long segments into patches of at
// most 16384 vertices so that a message stays well inside the 4 MiB gRPC
// limit. A client that sees the same patch_id from two site bundles keeps
// one; equal geometry_hash means equal geometry. layer_complete marks the
// last message as for every layer.
//
// radius_m on the request keeps the patches with any vertex within it.

// Where a vertex's height comes from.
enum RoadSupport {
  ROAD_SUPPORT_UNSPECIFIED = 0;
  // Fitted from class-2, non-withheld 3DEP points near the vertex: at least
  // RoadSurfaceLayer.min_points within RoadSurfaceLayer.fit_radius_m.
  ROAD_SUPPORT_OBSERVED = 1;
  // Too few points near it, but observed vertices on opposite sides within
  // RoadSurfaceLayer.max_interpolation_m: the height is bridged between them.
  ROAD_SUPPORT_INTERPOLATED = 2;
  // No height. z is NaN and the normal is NaN; no triangle uses the vertex.
  // Never filled from a neighbour or carried forward.
  ROAD_SUPPORT_MISSING = 3;
}

// Where a stretch of road boundary comes from. KERB_PAIR to INFERRED_WIDTH
// run from strongest to weakest; a patch's summary is its weakest edge
// other than AUTHORED cuts, which only end a patch or open a junction mouth.
enum RoadBoundarySource {
  ROAD_BOUNDARY_SOURCE_UNSPECIFIED = 0;
  // A DataSF kerb on both sides of the carriageway, reviewed as a pair.
  ROAD_BOUNDARY_SOURCE_KERB_PAIR = 1;
  // A DataSF kerb or island on this side only.
  ROAD_BOUNDARY_SOURCE_CITY_KERB = 2;
  // A hand-authored width about the DataSF centreline: inferred.
  ROAD_BOUNDARY_SOURCE_INFERRED_WIDTH = 3;
  // A hand-drawn edge, such as the mouth of a junction patch between arms.
  ROAD_BOUNDARY_SOURCE_AUTHORED = 4;
}

enum RoadPatchKind {
  ROAD_PATCH_KIND_UNSPECIFIED = 0;
  ROAD_PATCH_KIND_SEGMENT = 1;      // part of one City segment, between junction mouths
  ROAD_PATCH_KIND_JUNCTION = 2;     // a node's patch, bounded by its arms' mouths
}

// A safety component's state (SPEC-ROAD-SAFETY §2, §6). The prototype
// sends every component NOT_ASSESSED.
enum RoadAssessmentState {
  ROAD_ASSESSMENT_STATE_UNSPECIFIED = 0;
  ROAD_ASSESSMENT_STATE_NOT_ASSESSED = 1;
  ROAD_ASSESSMENT_STATE_ASSESSED = 2;
}

message RoadAssessment {
  string component = 1;             // "C1".."C18", SPEC-ROAD-SAFETY §2
  RoadAssessmentState state = 2;
  string source = 3;                // empty while NOT_ASSESSED
  string observed = 4;              // ISO date; empty while NOT_ASSESSED
}

// A closed ring in the site frame, without the closing vertex repeated.
// Outer rings run counter-clockwise seen from +z, holes clockwise.
message RoadRing {
  repeated float xyz = 1 [packed = true];  // interleaved x, y, z; z NaN where the boundary has no height
  // One per edge: edge i runs from vertex i to vertex i + 1 (the last back
  // to the first).
  repeated RoadBoundarySource edge_source = 2 [packed = true];
  bool hole = 3;                    // an island or other hole inside the outer ring
  string source_feature_id = 4;     // for a hole, the island's feature id ("datasf:<dataset>/<id>")
}

// Per-patch fit and coverage figures. Areas are horizontal, in m².
message RoadPatchStats {
  float area_m2 = 1;                // inside the outer ring less the holes
  float observed_area_m2 = 2;       // area whose nearest vertex is OBSERVED
  float interpolated_area_m2 = 3;
  float missing_area_m2 = 4;
  uint32 ground_points = 5;         // fitting points used inside the patch
  uint32 held_out_points = 6;       // points withheld from the fit for the residual check
  // Held-out residuals (point minus surface) over OBSERVED triangles, m.
  // NaN with no held-out points.
  float residual_median_m = 7;
  float residual_rms_m = 8;
  float residual_p95_abs_m = 9;
  // The rider's line: the band 0.5-1.5 m inside the outer ring's right
  // edge in each direction (SPEC-ROAD-SAFETY §2). Share of its length, 0-1.
  float rider_line_observed = 10;
  float rider_line_interpolated = 11;
  float rider_line_missing = 12;
}

// A station on the patch's centreline height profile, for a driving camera.
// s runs from the patch's start along RoadSurfacePatch.from_node ->
// to_node; position is on the surface (z NaN where the surface is MISSING).
message RoadProfileStation {
  float s_m = 1;
  Vector3 position = 2;             // site frame
  float grade = 3;                  // dz/ds, ratio; NaN where unsupported
  RoadSupport support = 4;
}

message RoadSurfacePatch {
  // Stable across rebuilds and site bundles for the same inputs:
  // "gms-preview:road/<corridor>/<kind>/<cnn or node cnn>/<n>".
  string patch_id = 1;
  RoadPatchKind kind = 2;
  // The City feature the patch belongs to: "datasf:3psu-pn9h/<cnn>" for a
  // segment, "datasf:cnn/<node cnn>" for a junction.
  string feature_id = 3;
  string cnn = 4;                   // the CNN alias; empty when none
  string name = 5;                  // "MARTIN LUTHER KING JR DR"
  string from_node = 6;             // segment: the City node cnns at its ends
  string to_node = 7;
  // The sources this patch was fitted from, as SourceInfo.version strings,
  // and the date of the ground observation (3DEP: "2023-04-20").
  string source_version = 8;
  string observed = 9;              // ISO date

  // Mesh, site frame. vertices interleaved x, y, z; normals interleaved,
  // unit, per vertex; support one per vertex. Indices are triangles into
  // this patch's vertices only (index scope is the patch), counter-
  // clockwise seen from +z (normals point up). No triangle uses a MISSING
  // vertex, so missing ground stays an open gap inside the rings.
  repeated float vertices = 10 [packed = true];
  repeated float normals = 11 [packed = true];
  repeated uint32 indices = 12 [packed = true];
  repeated RoadSupport support = 13 [packed = true];

  // The outer ring first, then holes. Vertices on a ring edge shared with
  // a neighbouring patch are the same physical points in both patches.
  repeated RoadRing rings = 14;
  RoadBoundarySource boundary_source = 15;  // the weakest of the rings' edge sources, AUTHORED cuts aside

  repeated RoadProfileStation profile = 16;
  repeated RoadAssessment assessments = 17;
  RoadPatchStats stats = 18;

  // sha256 hex of the patch's geometry and of its support, in EPSG:7131
  // (docs/INTERFACE-VISUALISER.md §14.3): equal across site bundles and
  // rebuilds of the same inputs.
  string geometry_hash = 19;
  string support_hash = 20;
}

// A selected road the server could not surface, with why, so a preview
// never implies coverage it does not have.
message RoadGap {
  string feature_id = 1;
  string cnn = 2;
  string name = 3;
  // "no_boundary", "no_ground", "structure", "tunnel", "excluded",
  // "car_free" and so on; message says more.
  string reason = 4;
  string message = 5;
  float length_m = 6;
}

// What a corridor's patches were built from and with. Sent in the first
// message of each corridor.
message RoadSurfaceLayer {
  uint32 version = 1;               // road_surface_version the layer was built under
  string corridor_id = 2;           // "ggp-mlk-1"
  string manifest_hash = 3;         // sha256 of the corridor's input manifest
  string build_hash = 4;            // sha256 over manifest_hash, the build parameters and every patch's hashes
  string source_crs = 5;            // "EPSG:7131"
  string source_vertical = 6;       // "EPSG:5703" (NAVD88)
  // Site frame <- EPSG:7131: how far, at most, a vertex sent in this site's
  // frame can differ from its EPSG:7131 position re-projected exactly; the
  // float32 rounding and the frame's own approximations together.
  float frame_accuracy_m = 7;
  float grid_m = 8;                 // the sampling grid, 0.5
  float fit_radius_m = 9;
  uint32 min_points = 10;
  float max_interpolation_m = 11;
  repeated RoadGap gaps = 12;       // selected roads with no patch, and why
  // Inventory totals for the park or area the corridor sits in, so a
  // reviewer can tell the corridor from the whole: lengths in m.
  float inventory_length_m = 13;
  float surfaced_length_m = 14;
  float inferred_length_m = 15;
  float missing_length_m = 16;
}

message RoadSurfaceChunk {
  RoadSurfaceLayer layer = 1;       // first message of each corridor only
  repeated RoadSurfacePatch patches = 2;
}
