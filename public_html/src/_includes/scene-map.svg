  aria-labelledby="scene-map-title scene-map-desc" class="scene-map">
  <title id="scene-map-title">Published LiDAR scenes</title>
  <desc id="scene-map-desc">Each published scene shown inside the S2 level 13 cell that indexes it,
    with its level 10 area cell for context: Ashbury at Downey in S2 cell 80858-0ac; Haight at
    Divisadero in S2 cell 80858-0ac; Pierce at Haight in S2 cell 80858-0a4; Fulton at Divisadero in
    S2 cell 80858-0b4; California between Leon and Baker in S2 cell 80858-0cc; Broadway at Gough in
    S2 cell 80858-0c4; Laguna at Eddy in S2 cell 80858-0bc; Lombard at Broderick in S2 cell
    80858-0d4; Marina at Broderick in S2 cell 80858-12c; Marina between Webster and Beach in S2 cell
    80858-124; Lombard at Laguna in S2 cell 80858-0dc; Columbus at North Point in S2 cell 80858-0e4;
    Embarcadero at Bay in S2 cell 80858-0fc; Columbus at Broadway in S2 cell 80858-0f4; van Ness at
    Sacramento in S2 cell 80858-0ec; Embarcadero at Broadway in S2 cell 80858-05c; Franklin at
    McAllister in S2 cell 80858-09c; Hyde at O'Farrell in S2 cell 80858-094; Bush at Powell in S2
    cell 80858-08c; Embarcadero at Folsom in S2 cell 80858-06c; 1st at Mission in S2 cell 80858-064;
    Embarcadero at Bryant in S2 cell 80858-074; 3rd at Folsom in S2 cell 80858-07c; Howard at 6th in
    S2 cell 80858-084.</desc>
  <style>
  .scene-map__frame { fill: none; stroke: currentColor; stroke-opacity: 0.18; }
  .scene-map__area { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.35; stroke-dasharray: 6 5; }
  .scene-map__area-label { fill: currentColor; fill-opacity: 0.55; font-size: 13px; }
  .scene-map__cell { fill: #34d399; fill-opacity: 0.16; stroke: #059669; stroke-width: 2; }
  .scene-map__marker { fill: #10b981; stroke: #ffffff; stroke-width: 2; paint-order: stroke; filter: drop-shadow(0 0 1px #000000); }
  .scene-map__title { fill: currentColor; font-size: 15px; font-weight: 600; }
  .scene-map__token { fill: currentColor; fill-opacity: 0.7; font-size: 12.5px; }
  .scene-map__scale { stroke: currentColor; stroke-opacity: 0.6; }
  .scene-map__scale-label { fill: currentColor; fill-opacity: 0.7; font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .scene-map__cell { fill: #34d399; fill-opacity: 0.2; stroke: #34d399; }
    .scene-map__marker { fill: #10b981; stroke: #ffffff; }
  }
</style>
