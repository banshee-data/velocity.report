  <title id="scene-map-title">Published LiDAR scenes</title>
  <desc id="scene-map-desc">Each published scene shown inside the S2 level 13 cell that indexes it, with its level 10 area cell for context: Haight at Divisadero in S2 cell 80858-0ac; Pierce at Haight in S2 cell 80858-0a4; Fulton at Divisadero in S2 cell 80858-0b4; California between Leon and Baker in S2 cell 80858-0cc; Broadway at Gough in S2 cell 80858-0c4; Laguna at Eddy in S2 cell 80858-0bc; Lombard at Laguna in S2 cell 80858-0dc; Broadway &amp; Columbus in S2 cell 80858-0f4; Embarcadero at Broadway in S2 cell 80858-05c; Bush at Powell in S2 cell 80858-08c; Howard at 6th in S2 cell 80858-084; Lombard at Broderick in S2 cell 80858-0d4; Marina at Broderick in S2 cell 80858-12c; Marina between Webster and Beach in S2 cell 80858-124; Columbus at North Point in S2 cell 80858-0e4; Embarcadero at Bay in S2 cell 80858-0fc; Franklin at McAllister in S2 cell 80858-09c; Hyde at O'Farrell in S2 cell 80858-094; 1st at Mission in S2 cell 80858-064; Embarcadero at Bryant in S2 cell 80858-074.</desc>
