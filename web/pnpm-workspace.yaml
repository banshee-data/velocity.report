# pnpm 11 replaced the `onlyBuiltDependencies` list with the `allowBuilds` map.
# These are the only dependencies permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  svelte-preprocess: true
  unrs-resolver: true

overrides:
  cookie@<0.7.0: 0.7.0
  devalue@<5.6.2: 5.6.2
  handlebars@<=4.7.8: ^4.7.9
  lodash-es@<=4.17.23: ^4.18.0
  picomatch@<2.3.2: 2.3.2
  # svelte-ux lists sveld (its API-docs Vite plugin, which this app does not load);
  # sveld 0.22 pulls in Svelte 4, which has XSS advisories with no 4.x fix.
  sveld@<0.38.1: ^0.38.1
