# pnpm 11 replaced the `onlyBuiltDependencies` list with the `allowBuilds` map.
# These are the only dependencies permitted to run install scripts.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  svelte-preprocess: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@sveltejs/kit@2.70.2'

overrides:
  cookie@<0.7.0: 0.7.0
  devalue@<5.6.2: 5.6.2
  handlebars@<=4.7.8: ^4.7.9
  lodash-es@<=4.17.23: ^4.18.0
  picomatch@<2.3.2: 2.3.2
  # svelte-ux lists sveld (a component-docs generator) as a runtime dependency,
  # which drags in Svelte 4. Only svelte-ux's own Vite plugin imports it, and
  # this app does not use that plugin, so remove it rather than carry Svelte 4.
  sveld: '-'
